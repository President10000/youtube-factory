name: 3x Daily Shorts Generator
on:
  schedule:
    # Runs at 12:00, 17:00, and 22:00 UTC
    - cron: "0 12,17,22 * * *"
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          - channel: mindset
            cookie_secret: COOKIE_MINDSET
          - channel: wealth
            cookie_secret: COOKIE_WEALTH
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -r requirements.txt
          npm install
          npx playwright install chromium --with-deps
          npm install -g 9router
      - env:
          OPENAI_API_BASE: "http://localhost:20128/v1"
          OPENAI_API_KEY: "dummy-key-for-9router"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          9router start &
          sleep 5
          9router add-key --provider gemini --key "$GEMINI_API_KEY" --tier 1
          9router add-key --provider openrouter --key "$OPENROUTER_API_KEY" --tier 2
          python agenttube.py --channel "${{ matrix.channel }}" --format short
      - env:
          YOUTUBE_COOKIE: ${{ secrets[matrix.cookie_secret] }}
        run: node autosocial_upload.js --channel "${{ matrix.channel }}" --format short
